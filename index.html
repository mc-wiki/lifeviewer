<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="LifeViewer" content="viewer textarea" />
    <title>LifeViewer</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
      }

      body {
        overflow: hidden;
      }

      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="viewer">
      <textarea style="display: none">
x = 8, y = 3, rule = B3/S23
bo3b3o$b3o2bo$2bo!</textarea
      >
      <canvas width="560" height="560"></canvas>
    </div>

    <script>
      const textarea = document.querySelector('.viewer textarea')

      const parentOrigin = (() => {
        try {
          return new URL(document.referrer).origin
        } catch {
          return null
        }
      })()

      window.addEventListener('message', (event) => {
        if (event.source !== window.parent) return
        if (parentOrigin !== null && event.origin !== parentOrigin) return
        if (event.data?.type !== 'lifeviewer-pattern') return
        if (typeof event.data.pattern !== 'string') return

        textarea.value = event.data.pattern
        textarea.textContent = event.data.pattern

        if (typeof window.updateMe === 'function') window.updateMe(textarea)
      })

      if (window.parent !== window)
        window.parent.postMessage({ type: 'lifeviewer-ready' }, '*')
    </script>
    <script src="lv-plugin.js"></script>
  </body>
</html>
