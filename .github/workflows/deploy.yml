name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Refresh the bundled plugin daily, picking up new LifeViewer releases.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Build site
        run: |
          mkdir -p _site
          cp index.html _site/
          curl -fsSL --retry 3 \
            -o _site/lv-plugin.js \
            https://lazyslug.com/lifeview/plugin/js/release/lv-plugin.js

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
